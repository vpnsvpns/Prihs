mode: rule
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 300
keep-alive-interval: 60
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  prefer-h3: false
  ipv6: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - .lan
    - .local
    - localhost
    - time.*.com
    - time.*.gov
    - time.*.apple.com
    - time-ios.apple.com
    - "*.pool.ntp.org"
    - +.push.apple.com
    - +.stun.*.*
    - +.stun.*.*.*
    - lens.l.google.com
    - "*.msftncsi.com"
    - "*.msftconnecttest.com"
  cache-algorithm: arc
  default-nameserver:
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 1.1.1.1
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    - https://dns.quad9.net/dns-query
    - https://doh.opendns.com/dns-query
    - https://dns.adguard-dns.com/dns-query
    - https://dns.mullvad.net/dns-query
  proxy-server-nameserver:
    - 8.8.8.8
    - 1.1.1.1
    - 9.9.9.9
    - system
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
proxies:
  - name: Prihs Node 001 | Данная подписка
    type: vless
    server: ""
    port: 443
    uuid: 1:1
    udp: true
proxy-groups:
  - name: Prihs Auto Select
    type: url-test
    include-all: true
    exclude-type: Direct|Reject|RejectDrop|Compatible|Pass|Dns
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    lazy: true
    timeout: 5000
    max-failed-times: 2
    expected-status: 204
  - name: Prihs Manual
    type: select
    proxies:
      - Prihs Auto Select
    include-all: true
    exclude-type: Direct|Reject|RejectDrop|Compatible|Pass|Dns
    default-selected: Prihs Auto Select
  - name: GLOBAL
    type: select
    proxies:
      - Prihs Auto Select
      - Prihs Manual
    default-selected: Prihs Auto Select
rules:
  - DOMAIN-SUFFIX,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - DOMAIN-SUFFIX,ru,DIRECT
  - DOMAIN-SUFFIX,xn--p1ai,DIRECT
  - GEOSITE,category-ru,DIRECT
  - GEOIP,RU,DIRECT
  - MATCH,Prihs Manual
