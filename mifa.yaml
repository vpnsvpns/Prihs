  store-fake-ip: true
dns:
  enable: true
  prefer-h3: false
  ipv6: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - .lan
    - .local
    - localhost
    - time.*.com
    - time.*.gov
    - time.*.apple.com
    - time-ios.apple.com
    - "*.pool.ntp.org"
    - +.push.apple.com
