mode: rule
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 300
keep-alive-interval: 60
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  prefer-h3: false
  ipv6: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - .lan
    - .local
    - localhost
    - time.*.com
    - time.*.gov
    - time.*.apple.com
    - time-ios.apple.com
    - "*.pool.ntp.org"
    - +.push.apple.com
    - +.stun.*.*
    - +.stun.*.*.*
    - lens.l.google.com
    - "*.msftncsi.com"
    - "*.msftconnecttest.com"
  cache-algorithm: arc
  default-nameserver:
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 1.1.1.1
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    - https://dns.quad9.net/dns-query
    - https://doh.opendns.com/dns-query
    - https://dns.adguard-dns.com/dns-query
    - https://dns.mullvad.net/dns-query
  proxy-server-nameserver:
    - 8.8.8.8
    - 1.1.1.1
    - 9.9.9.9
    - system
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
