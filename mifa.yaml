    - lens.l.google.com
    - "*.msftncsi.com"
    - "*.msftconnecttest.com"
  cache-algorithm: arc
  default-nameserver:
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 1.1.1.1
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
