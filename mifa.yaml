proxy-groups:
  - name: Prihs Auto Select
    type: url-test
    include-all: true
    exclude-type: Direct|Reject|RejectDrop|Compatible|Pass|Dns
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    lazy: true
    timeout: 5000
    max-failed-times: 2
    expected-status: 204
  - name: Prihs Manual
    type: select
    proxies:
      - Prihs Auto Select
    include-all: true
    exclude-type: Direct|Reject|RejectDrop|Compatible|Pass|Dns
    default-selected: Prihs Auto Select
